onboarding = false
keys.prefix = "ctrl+t"
keys.previous_workspace = "ctrl+["
keys.next_workspace = "ctrl+]"

keys.next_tab = ["prefix+n", "cmd+]"]
keys.previous_tab = ["prefix+p", "cmd+["]

keys.focus_pane_left = "cmd+ctrl+h"
keys.focus_pane_down = "cmd+ctrl+j"
keys.focus_pane_up = "cmd+ctrl+k"
keys.focus_pane_right = "cmd+ctrl+l"

[theme]
name = "tokyo-night"
auto_switch = false
